name: Daily News Automation

on:
  workflow_dispatch: # started by your external timer or by hand; no schedule block, so nothing runs twice

permissions:
  contents: read

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install feedparser requests; fi

      - name: Run main.py
        run: python main.py
        env:
          # Telegram secrets
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Green API (WhatsApp) secrets
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}  # optional; leave the secret out to use the defaults
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}

          PYTHONUNBUFFERED: "1"
          PYTHONUTF8: "1"